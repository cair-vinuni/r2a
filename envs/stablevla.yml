# stablevla — StableVLA (VLA-Adapter) policy + LIBERO-Plus eval harness.
#
# A portable rebuild of the `stablevla` conda environment.
# Pins below were captured from `pip freeze` of that env (Python 3.10.20), trimming pure
# dev/plumbing noise (ipython, jedi, wandb transitive junk, etc.) and keeping the load-bearing
# runtime pins. To reproduce exactly, `conda activate stablevla` — this file is a portable rebuild.
#
#   conda env create -f envs/stablevla.yml && conda activate stablevla
#   # then, from the StableVLA repo, `pip install -e stablevla`  (installs vla_adapter)
#
# Headless LIBERO/robosuite render:  export MUJOCO_GL=osmesa  PYOPENGL_PLATFORM=osmesa
name: stablevla
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # --- torch stack (CUDA 12.1) ---
      - torch==2.2.0
      - torchvision==0.17.0
      - torchaudio==2.2.0
      - triton==2.2.0
      # flash-attn built for cu122/torch2.2/cp310 (prebuilt wheel):
      - https://github.com/Dao-AILab/flash-attention/releases/download/v2.5.5/flash_attn-2.5.5+cu122torch2.2cxx11abiFALSE-cp310-cp310-linux_x86_64.whl

      # --- StableVLA / OpenVLA-OFT policy stack ---
      - transformers @ git+https://github.com/moojink/transformers-openvla-oft.git@bc339d9ad707454c0c115970db43c260067c61ab
      - tokenizers==0.19.1
      - peft==0.11.1
      - timm==0.9.10
      - diffusers==0.30.3
      - accelerate==1.14.0
      - safetensors==0.8.0
      - huggingface_hub==0.36.2
      - sentencepiece==0.1.99
      - einops==0.8.2
      - draccus==0.8.0
      - json-numpy==2.1.1
      - dlimp @ git+https://github.com/moojink/dlimp_openvla@040105d256bd28866cc6620621a3d5f7b6b91b46

      # --- LIBERO + robosuite + mujoco (headless render) ---
      - git+https://github.com/Lifelong-Robot-Learning/LIBERO.git@8f1084e3132a39270c3a13ebe37270a43ece2a01
      - robosuite==1.4.1
      - mujoco==3.3.0
      - bddl==3.5.0
      - PyOpenGL==3.1.10
      - opencv-python-headless==4.9.0.80

      # --- TensorFlow / TFDS data path (dlimp/rlds loading) ---
      # StableVLA's own pyproject pins tensorflow==2.15.0; the live `stablevla` conda env has
      # drifted to 2.21.0. We keep the declared 2.15.0 pin (repro target); bump only if TFDS breaks.
      - tensorflow==2.15.0
      - tensorflow-datasets==4.9.3

      # --- serving (policy server) ---
      - fastapi==0.138.0
      - uvicorn==0.49.0
      - websockets==16.0
      - msgpack==1.2.1

      # --- numerics / I/O ---
      - numpy==1.26.4
      - scipy==1.15.3
      - matplotlib==3.10.9
      - imageio==2.37.3
      - imageio-ffmpeg==0.6.0
      - scikit-image==0.22.0
      - h5py==3.14.0
      - pyyaml==6.0.3
      - tqdm

      # --- dev ---
      - pytest
