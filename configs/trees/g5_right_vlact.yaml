# One arm of the g5 tasks as a joint-space proxy corpus (python -m robot_ood.data.robotwin), built
# against VLAct: six joints stand where a pose would, so dims 3:6 add rather than compose.
policy: vlact
task_suite: g5
tasks: evals/robotwin/suites/g5.txt
arm: right
ee_from_obs: true
pose_space: euclidean
data:
  hdf5: robotwin/hdf5/g5_right
  fwm: fwm/g5_right
artifacts: g5_right_vlact/artifacts
eval:
  pi05_robotwin_ckpt: pi05/robotwin/RoboTwin-lerobot_v30-aloha_agilex-joint-0/29999
  vlact_ckpt: data/vlact/robotwin_finetune/checkpoints/steps_50000_pytorch_model.pt
